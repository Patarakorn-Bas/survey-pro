<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2D33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>สำรวจและวางผัง Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>@font-face{font-family:"AppThai";src:local("TH SarabunPSK"),local("THSarabunPSK"),local("TH SarabunPSK Regular");size-adjust:138%;font-weight:400}
@font-face{font-family:"AppThai";src:local("TH SarabunPSK Bold"),local("THSarabunPSK-Bold"),local("TH SarabunPSK");size-adjust:138%;font-weight:700}
:root{
  --ink:#1B2A2F;--muted:#5D6C68;--paper:#E9EDE8;--sheet:#F8FAF6;--rule:#CBD4CC;--rule2:#DFE5DE;
  --flag:#C2185B;--flag-ink:#fff;--flag-soft:#F7DCE7;--ctrl:#1F4F99;--ctrl-soft:#DCE6F5;
  --good:#24724F;--good-soft:#DAEEE3;--bad:#B3261E;--bad-soft:#F7DEDB;--warn:#8A5A00;--warn-soft:#F6EBCF;
  --cut:#C2412E;--fill:#2E6AB0;--rail:#1E2D33;--rail-ink:#C9D4D0;--input:#fff;
  --f:"AppThai","Sarabun",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E2E9E5;--muted:#93A39E;--paper:#10181A;--sheet:#172226;--rule:#2E3D41;--rule2:#243236;
  --flag:#F0609A;--flag-ink:#1A0610;--flag-soft:#3A1A28;--ctrl:#7FA9F2;--ctrl-soft:#1C2B44;
  --good:#6FCF9C;--good-soft:#173328;--bad:#FF8A80;--bad-soft:#3B1C1A;--warn:#E8C26A;--warn-soft:#352B12;
  --cut:#F07A63;--fill:#6EA6EE;--rail:#0B1214;--rail-ink:#AFC0BA;--input:#0F1A1D;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#E2E9E5;--muted:#93A39E;--paper:#10181A;--sheet:#172226;--rule:#2E3D41;--rule2:#243236;
  --flag:#F0609A;--flag-ink:#1A0610;--flag-soft:#3A1A28;--ctrl:#7FA9F2;--ctrl-soft:#1C2B44;
  --good:#6FCF9C;--good-soft:#173328;--bad:#FF8A80;--bad-soft:#3B1C1A;--warn:#E8C26A;--warn-soft:#352B12;
  --cut:#F07A63;--fill:#6EA6EE;--rail:#0B1214;--rail-ink:#AFC0BA;--input:#0F1A1D;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--rail);color:#fff;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand svg{flex:none}
.brand b{font-size:19px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-size:12.5px;color:var(--rail-ink);font-weight:400;margin-top:-3px}
.proj{display:flex;gap:6px;align-items:center;flex:1;min-width:220px}
.proj select,.proj input{background:#ffffff14;border:1px solid #ffffff2a;color:#fff;border-radius:6px;padding:4px 8px;min-width:0}
.proj select{max-width:180px}.proj input{flex:1;max-width:260px}
.proj select option{color:#000}
.tb{display:flex;gap:6px;flex-wrap:wrap}
.tb button{background:transparent;border:1px solid #ffffff38;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.tb button:hover{background:#ffffff18}

/* layout */
.app{flex:1;display:flex;min-height:0}
.rail{width:178px;flex:none;background:var(--rail);display:flex;flex-direction:column;padding:10px 0;gap:2px;overflow:auto}
.rail button{all:unset;cursor:pointer;color:var(--rail-ink);padding:9px 16px 9px 20px;position:relative;font-size:16px;line-height:1.25}
.rail button small{display:block;font-size:12.5px;opacity:.7}
.rail button:hover{color:#fff;background:#ffffff0c}
.rail button[aria-current="page"]{color:#fff;background:#ffffff12}
.rail button[aria-current="page"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:6px;background:repeating-linear-gradient(-45deg,var(--flag) 0 5px,#ff9ec4 5px 8px)}
.rail button:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
.work{flex:1;display:grid;grid-template-columns:minmax(420px,48%) 1fr;min-width:0;min-height:0}
.panel{overflow:auto;padding:18px 22px 60px;min-width:0;background:var(--sheet);border-right:1px solid var(--rule)}
.plan{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.plan canvas{flex:1;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:var(--sheet)}
.planbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--rule);background:var(--sheet);font-size:14px;flex-wrap:wrap}
.planbar button{border:1px solid var(--rule);background:var(--input);border-radius:6px;padding:2px 10px;cursor:pointer}
.readout{margin-left:auto;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--sheet) 88%,transparent);border:1px solid var(--rule);border-radius:6px;padding:4px 10px;font-size:13.5px;color:var(--muted);pointer-events:none;max-width:70%}
.legend:empty{display:none}

/* panel typography */
.panel h1{font-size:26px;line-height:1.15;margin:0 0 2px;font-weight:700}
.panel .lede{color:var(--muted);margin:0 0 14px;max-width:62ch}
.panel h2{font-size:18px;margin:22px 0 8px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.panel h2::after{content:"";flex:1;border-bottom:1px solid var(--rule)}
.panel h3{font-size:16px;margin:14px 0 6px;font-weight:600}
.hint{color:var(--muted);font-size:14.5px;margin:4px 0 10px;max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span{font-size:13.5px;color:var(--muted)}
.f input,.f select,textarea{background:var(--input);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;min-width:0;width:100%}
.f.w1{width:96px}.f.w2{width:130px}.f.w3{width:170px}.f.w4{width:230px}.f.grow{flex:1;min-width:180px}
.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--input)}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.btn{border:1px solid var(--rule);background:var(--input);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--flag);color:var(--flag-ink);border-color:var(--flag);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:2px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.box{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--input)}
.box.sub{background:transparent}

/* tables */
.tw{overflow-x:auto;max-width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--input)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:600;font-size:13.5px;color:var(--muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule);background:var(--sheet);white-space:nowrap;position:sticky;top:0}
td{padding:3px 8px;border-bottom:1px solid var(--rule2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.c,th.c{text-align:center}
table.grid td{padding:0;border-right:1px solid var(--rule2)}
table.grid td:last-child{border-right:0}
table.grid input{border:0;background:transparent;width:100%;padding:5px 8px;min-width:70px}
table.grid input:focus{background:var(--flag-soft);outline:none}
table.grid td.ix{color:var(--muted);font-size:13px;text-align:center;width:34px;padding:0 4px}
table.grid td.x{width:30px;text-align:center}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.del:hover{color:var(--bad)}
tr.flag td{background:var(--bad-soft)}
.tag{display:inline-block;border-radius:4px;padding:0 7px;font-size:13.5px;font-weight:600}
.tag.ok{background:var(--good-soft);color:var(--good)}.tag.no{background:var(--bad-soft);color:var(--bad)}.tag.w{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;background:var(--input);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:10px 0}
.stats div{padding:8px 12px;box-shadow:0 0 0 .5px var(--rule)}
.stats span{display:block;font-size:13px;color:var(--muted)}
.stats b{font-size:19px;font-weight:600}
.stats b small{font-size:13px;font-weight:400;color:var(--muted)}
.err{border-left:4px solid var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.err li{margin:2px 0}
.note{border-left:4px solid var(--ctrl);background:var(--ctrl-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cards .box{margin:0}
.cards h3{margin-top:0}
.out{margin-top:8px;font-size:15px}
.out .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.out .kv span{color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--muted);font-size:14px}
textarea{width:100%;min-height:110px;font-size:14px}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--rule);border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:8px;z-index:50;max-width:90vw;font-size:15px;box-shadow:0 6px 24px #0003}
.toast[hidden]{display:none}
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);max-width:min(560px,92vw);padding:18px 20px}
dialog::backdrop{background:#0006}
.vis-sm{display:none}

@media (max-width:1100px){
  .work{display:flex;flex-direction:column;overflow:auto}
  .plan{order:-1;flex:none;height:44vh;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--rule)}
  .plan.min{height:auto}.plan.min canvas,.plan.min .legend{display:none}
  .panel{overflow:visible;border-right:0}
  .vis-sm{display:inline-block}
}
@media (max-width:760px){
  .app{flex-direction:column-reverse}
  .rail{width:auto;flex-direction:row;padding:0;overflow-x:auto;padding-bottom:0}
  .rail button{padding:8px 12px;white-space:nowrap;font-size:15px}
  .rail button small{display:none}
  .rail button[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:4px}
  .panel{padding:14px 14px 40px}
  .work{grid-template-columns:1fr}
  .plan{height:36vh}
  .brand small{display:none}.brand b{font-size:17px}.brand svg{width:24px;height:24px}
  .top{gap:6px;padding:6px 10px}
  .proj{min-width:0;flex:1 1 140px}.proj input{display:none}.proj select{max-width:none;flex:1}
  .tb button{padding:2px 8px;font-size:14px}
  .readout{flex-basis:100%;margin-left:0;font-size:12.5px}
  .toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .f.w3,.f.w4{width:calc(50% - 6px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.helpln{font:inherit;font-size:13.5px;font-weight:500;vertical-align:middle;margin-left:8px;border:1px solid var(--rule);background:var(--input);color:var(--muted);border-radius:999px;padding:1px 10px;cursor:pointer}
.helpln:hover{color:var(--flag);border-color:var(--flag)}
details.hlp{border:1px solid var(--rule);border-radius:8px;margin:8px 0;background:var(--input)}
details.hlp summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:16.5px;list-style:none;display:flex;align-items:center;gap:10px}
details.hlp summary::-webkit-details-marker{display:none}
details.hlp summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.hlp[open] summary::before{transform:rotate(45deg)}
details.hlp[open] summary{border-bottom:1px solid var(--rule2)}
.hb{padding:6px 16px 12px;max-width:72ch;font-size:15.5px}
.hb ol,.hb ul{padding-left:22px;margin:6px 0}.hb li{margin:4px 0}
.hb code{background:var(--sheet);border:1px solid var(--rule2);border-radius:4px;padding:0 5px;font-family:inherit}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 L27 26 H3 Z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="15" cy="17" r="3.2" fill="#F0609A"/><path d="M15 9v16M8 17h14" stroke="#fff" stroke-width="1"/></svg>
    <div><b>สำรวจและวางผัง Pro</b><small>Least Squares · COGO · TIN · ปริมาตรดิน</small></div>
  </div>
  <div class="proj"><select id="projSel" aria-label="เลือกโครงการ"></select><input id="projName" aria-label="ชื่อโครงการ" autocomplete="off"></div>
  <div class="tb"><button id="newBtn">โครงการใหม่</button><button id="sampleBtn">ตัวอย่าง</button><button id="setBtn">ตั้งค่า</button></div>
</header>
<div class="app">
  <nav class="rail" id="rail" aria-label="เครื่องมือ"></nav>
  <div class="work">
    <section class="panel" id="panel" aria-live="polite"></section>
    <section class="plan" id="plan" aria-label="แผนผัง">
      <div class="planbar"><button id="fitBtn">พอดีจอ</button><button id="zin" aria-label="ซูมเข้า">+</button><button id="zout" aria-label="ซูมออก">−</button><button id="planToggle" class="vis-sm">ซ่อนแผนผัง</button><span class="readout" id="readout">ลากเพื่อเลื่อน · ล้อเมาส์หรือสองนิ้วเพื่อซูม</span></div>
      <canvas></canvas>
      <div class="legend" id="legend"></div>
    </section>
  </div>
</div>
<datalist id="ptlist"></datalist>
<dialog id="setDlg"></dialog>

    const h1 = panel.querySelector('h1'); if (h1 && A.tab() !== 'help') h1.insertAdjacentHTML('beforeend', ` <button class="helpln" data-act="help" data-v="${A.tab()}">คู่มือ</button>`);
    if (A.tab() === 'help' && A.pwaNote) A.pwaNote();
    if (keepScroll) panel.scrollTop = sy;
    A.drawPlan();
  }
  A.go = t => go(t);
  function go(t) { A.setTab(t); nav(); R.fit = true; render(); panel.scrollTop = 0; const wk = document.querySelector('.work'); if (wk) wk.scrollTop = 0; }
  $('#rail').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); });

  /* inputs */
  panel.addEventListener('input', e => {

  });
  panel.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.actFile) { const f = el.files && el.files[0]; if (f) readFile(f, el.dataset.actFile); el.value = ''; return; }
    const k = el.dataset.k; if (!k) return;

    if (el.dataset.rr) render(true); else if (A.tab() === 'cogo') A.cogoLive(); else A.drawPlan();
  });
  // paste from spreadsheet into grid tables
  panel.addEventListener('paste', e => {
    const el = e.target; const tb = el.closest && el.closest('table.grid'); if (!tb || tb.dataset.mat) return;
    const txt = (e.clipboardData || window.clipboardData).getData('text'); if (!/[\t\n]/.test(txt.trim())) return;
    e.preventDefault();
    const path = tb.dataset.path; const rows = getP(path); const r0 = +el.dataset.r, c0 = +el.dataset.c;
    const keys = [...tb.querySelectorAll('tbody tr:first-child input')].map(i => i.dataset.k.split('.').pop());
    const lines = txt.replace(/\r/g, '').split('\n'); if (lines[lines.length - 1] === '') lines.pop();
    lines.forEach((ln, i) => { const cells = ln.split('\t'); const ri = r0 + i; if (!rows[ri]) rows[ri] = Object.fromEntries(keys.map(k => [k, ''])); cells.forEach((v, j) => { const k = keys[c0 + j]; if (k) rows[ri][k] = v.trim(); }); });
    if (path === 'pts') A.ptsDirty(); A.refreshDatalist(); persist(); render(true); toast(`วางข้อมูล ${lines.length} แถว`);
  });

  /* actions */
  const ACT = {
    set(el) { setP(el.dataset.k, el.dataset.v); persist(); render(true); },
    addrow(el) { const p = el.dataset.path; const rows = getP(p); const tmpl = rows.length ? Object.fromEntries(Object.keys(rows[0]).map(k => [k, ''])) : (p === 'pts' ? { n: '', E: '', N: '', Z: '', c: '' } : {}); rows.push(tmpl); if (p === 'pts') { A.ptPage(Math.floor((rows.length - 1) / 150)); A.ptQ(''); } persist(); render(true); const ins = panel.querySelectorAll(`table[data-path="${p}"] tbody tr:last-child input`); if (ins[0]) ins[0].focus(); },
    delrow(el) { const p = el.dataset.path; const rows = getP(p); rows.splice(+el.dataset.i, 1); if (p === 'pts') A.ptsDirty(); persist(); render(true); A.refreshDatalist(); },
    pg(el) { A.ptPage(A.ptPage() + +el.dataset.v); render(); },
    csvpaste() { const t = $('#csvPaste').value; if (!t.trim()) { toast('วางข้อความ CSV ลงในช่องก่อน'); return; } A.importRows(SV.parseCSV(t), (S().ui || {}).csvOrder || 'PENZD', (S().ui || {}).csvDup || 'replace'); render(); R.fit = true; A.drawPlan(); },
    async csvexport() { const rows = S().pts.filter(p => String(p.n).trim()).map(p => [p.n, p.E, p.N, p.Z, p.c].map(v => /[",]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? '')).join(',')); if (!rows.length) { toast('ยังไม่มีจุดให้ส่งออก'); return; } await A.saveFile(fn() + '_points.csv', '\uFEFF' + 'Name,E,N,Z,Code\r\n' + rows.join('\r\n') + '\r\n', 'text/csv'); },
    ptsclear() { if (!S().pts.length) return; if (!confirm(`ลบจุดทั้งหมด ${S().pts.length} จุด?`)) return; S().pts = []; A.ptsDirty(); A.refreshDatalist(); persist(); render(); },
    travcalc() { A.travCalc(); render(true); const o = $('#travOut'); if (o) o.scrollIntoView({ block: 'start', behavior: 'smooth' }); },
    travsave(el) { const r = R.trav; if (!r) return; let n = 0; if (el.dataset.v === 'ls') { r.ls.pts.forEach(p => { A.upsert(p.name, p.E, p.N, undefined); n++; }); } else { Object.entries(r.tr.bowditch).forEach(([k, p]) => { if (!(r.tr.knownUsed || []).includes(k)) { A.upsert(k, p.E, p.N, undefined); n++; } }); } persist(); toast(`บันทึกพิกัด ${n} หมุดลงฐานข้อมูลจุดแล้ว`); A.drawPlan(); },
    bookcalc() { R.book = SV.levelBook(S().lev.book); render(true); },
    booksave() { const r = R.book; let n = 0, miss = []; r.rows.forEach((x, i) => { if (!x.pt || i === 0) return; const z = OK(x.adj) ? x.adj : x.rl; if (OK(z)) { if (A.setZ(x.pt, z)) n++; else miss.push(x.pt); } }); persist(); toast(`อัปเดตระดับ ${n} จุด${miss.length ? ` — ไม่พบในฐานข้อมูล: ${[...new Set(miss)].join(', ')}` : ''}`, 5000); },
    book2net() { const r = R.book; const rows = r.rows; const a = rows[0].pt, b = rows[rows.length - 1].pt; if (!a || !b) { toast('ใส่ชื่อจุดแรกและจุดสุดท้ายในสมุดระดับ'); return; } const net = S().lev.net; const emp = net.obs.findIndex(o => !o.from && !o.to && !o.dh); const o = { from: a, to: b, dh: (rows[rows.length - 1].rl - rows[0].rl).toFixed(4), dist: S().lev.book.km || '' }; if (emp >= 0) net.obs[emp] = o; else net.obs.push(o); if (!net.bms.some(x => x.name === a) && OK(N(S().lev.book.startRL))) { const e2 = net.bms.findIndex(x => !x.name); const bm = { name: a, H: S().lev.book.startRL }; if (e2 >= 0) net.bms[e2] = bm; else net.bms.push(bm); } persist(); toast(`เพิ่มสาย ${a}→${b} ในโครงข่ายแล้ว${o.dist ? '' : ' (ใส่ระยะ กม. ในโครงข่ายด้วย)'}`); },
    bmfromdb() { const bms = S().lev.net.bms; let n = 0; bms.forEach(b => { const p = PM()[String(b.name).trim()]; if (p && OK(p.Z)) { b.H = p.Z.toFixed(4); n++; } }); persist(); render(true); toast(n ? `ดึงระดับ ${n} หมุด` : 'ไม่พบหมุดที่มีค่า Z ในฐานข้อมูล'); },
    netcalc() { R.net = SV.levelNet(S().lev.net.bms, S().lev.net.obs, S().lev.net.k); render(true); },
    netsave() { let n = 0; const miss = []; R.net.pts.forEach(p => { if (A.setZ(p.name, p.H)) n++; else miss.push(p.name); }); persist(); toast(`อัปเดตระดับ ${n} จุด${miss.length ? ` — ไม่พบในฐานข้อมูล: ${miss.join(', ')}` : ''}`, 5000); },
    savept(el) { A.upsert(el.dataset.n, +el.dataset.e, +el.dataset.nn, undefined); persist(); toast(`บันทึกจุด ${el.dataset.n} แล้ว`); A.cogoLive(); },
    stakecalc() { A.stakeCalc(); render(true); },
    gridprev() { R.gridPrev = A.gridBuild(); R.gridMsg = R.gridPrev.errs.length ? A.errs(R.gridPrev.errs) : `<p class="hint">กริด ${R.gridPrev.nx} × ${R.gridPrev.ny} แกน รวม ${R.gridPrev.pts.length} จุด</p>`; R.fit = true; render(true); },
    gridmake() { const g = A.gridBuild(); R.gridPrev = g; if (g.errs.length) { R.gridMsg = A.errs(g.errs); render(true); return; } const Z = N(S().grid.Z); g.pts.forEach(p => A.upsert(p.name, p.E, p.N, OK(Z) ? Z : undefined, S().grid.code || 'GRID')); persist(); R.gridMsg = `<p class="note">สร้าง ${g.pts.length} จุดลงฐานข้อมูลแล้ว ใส่รหัส <b>${esc(S().grid.code || 'GRID')}</b> ในช่อง “หรือรหัสจุด” ด้านบนเพื่อคำนวณวางผังทุกจุด</p>`; R.fit = true; render(true); },
    tincalc() { A.tinCalc(); render(true); },
    volcalc() { A.volCalc(false); render(true); },
    volbal() { A.volCalc(true); render(true); },
    dxf() { A.exportDXF(); },
    pdf(el) { el.disabled = true; el.textContent = 'กำลังสร้าง PDF…'; A.exportPDF().finally(() => { el.disabled = false; el.textContent = 'สร้าง PDF'; }); },
    async jsonexport() { await A.saveFile(fn() + '.json', JSON.stringify(S(), null, 1), 'application/json'); }
  };
  const fn = () => (S().name || 'survey').replace(/[\\/:*?"<>|]+/g, '_');
  panel.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = ACT[b.dataset.act] || (A.ACT2 || {})[b.dataset.act]; if (f) { e.preventDefault(); f(b); } });

  function readFile(f, kind) {
    const rd = new FileReader();
    rd.onload = () => {
      const t = String(rd.result);
      if (kind === 'csv') { A.importRows(SV.parseCSV(t), (S().ui || {}).csvOrder || 'PENZD', (S().ui || {}).csvDup || 'replace'); R.fit = true; render(); }
      else if (kind === 'json') { try { const o = JSON.parse(t); if (!o || !Array.isArray(o.pts)) throw 0; const p = A.merge(A.blank(), o); p.id = 'p' + Date.now().toString(36); A.setS(p); clearResults(); A.ptsDirty(); A.refreshDatalist(); A.saveNow(); go('pts'); toast('เปิดโครงการ ' + p.name); } catch (err) { toast('ไฟล์นี้ไม่ใช่ไฟล์โครงการของแอปนี้'); } }
    };
    rd.readAsText(f);
  }
  function clearResults() { ['trav', 'book', 'net', 'stake', 'gridPrev', 'gridMsg', 'tin', 'vol', 'cogo'].forEach(k => delete R[k]); R.fit = true; }

  /* projects */
  window.projSelect = function () { const ix = A.index(); const s = $('#projSel'); s.innerHTML = ix.list.map(p => `<option value="${esc(p.id)}"${p.id === S().id ? ' selected' : ''}>${esc(p.name)}</option>`).join(''); $('#projName').value = S().name; };
  $('#projSel').addEventListener('change', e => { A.saveNow(); if (A.loadProj(e.target.value)) { clearResults(); A.ptsDirty(); A.refreshDatalist(); A.saveNow(); go(A.tab()); } });
  $('#projName').addEventListener('input', e => { S().name = e.target.value; persist(); });
  $('#newBtn').onclick = () => { A.saveNow(); A.setS(A.blank('โครงการใหม่ ' + (A.index().list.length + 1))); clearResults(); A.ptsDirty(); A.refreshDatalist(); A.saveNow(); go('pts'); };
  const delProj = () => { if (!confirm(`ลบโครงการ “${S().name}” ออกจากเครื่องนี้?`)) return; const ix = A.index(); ix.list = ix.list.filter(p => p.id !== S().id); A.store.del(A.LS_PRE + S().id); A.store.set(A.LS_IDX, JSON.stringify(ix)); if (ix.list.length && A.loadProj(ix.list[0].id)) { } else A.setS(A.blank()); clearResults(); A.ptsDirty(); A.refreshDatalist(); A.saveNow(); go('pts'); };
  $('#sampleBtn').onclick = () => { A.saveNow(); A.setS(sample()); clearResults(); A.ptsDirty(); A.refreshDatalist(); A.saveNow(); A.travCalc(); if (R.trav.ls && !R.trav.ls.err) R.trav.ls.pts.forEach(q => A.upsert(q.name, q.E, q.N, undefined, 'TRV')); A.travCalc(); A.tinCalc(); A.lgCalc(false); R.book = SV.levelBook(S().lev.book); R.net = SV.levelNet(S().lev.net.bms, S().lev.net.obs, S().lev.net.k); A.stakeCalc(); R.gridPrev = A.gridBuild(); A.saveNow(); go('trav'); toast('โหลดโครงการตัวอย่างแล้ว ลองกดคำนวณในแต่ละเมนู'); };
  /* settings */
  $('#setBtn').onclick = () => {
    const d = $('#setDlg'); const s = S().set;
    d.innerHTML = `<form method="dialog"><h2 style="margin:0 0 10px;font-size:20px">ตั้งค่า</h2>
      <div class="row">${A.sel('รูปแบบป้อนมุม', 'set.angFmt', [['dms', 'ddd.mmss (87.2315)'], ['deg', 'องศาทศนิยม']], { w: 'w4' })}${A.sel('ทศนิยมวินาที', 'set.secDec', [['0', '0'], ['1', '1'], ['2', '2']], { w: 'w2' })}</div>
      <div class="row" style="margin-top:8px">${A.sel('ทศนิยมพิกัด', 'set.dec', [['3', '3 (มม.)'], ['4', '4']], { w: 'w2' })}${A.sel('วงรีความคลาดเคลื่อน', 'set.ell', [['95', 'ความเชื่อมั่น 95%'], ['1', 'มาตรฐาน 1σ']], { w: 'w3' })}${A.sel('ธีม', 'set.theme', [['', 'ตามระบบ'], ['light', 'สว่าง'], ['dark', 'มืด']], { w: 'w2' })}</div>
      <p class="hint" style="margin-top:12px">ข้อมูลโครงการบันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ ใช้ “บันทึกโครงการ (.json)” ในเมนูส่งออกเพื่อสำรองหรือย้ายเครื่อง</p>
      <div class="actions" style="justify-content:space-between"><button type="button" class="btn ghost" id="delBtn">ลบโครงการนี้</button><button class="btn pri" value="ok">เสร็จ</button></div></form>`;
    d.showModal(); $('#delBtn').onclick = () => { d.close(); delProj(); };
  };
  $('#setDlg').addEventListener('change', e => { const k = e.target.dataset.k; if (!k) return; setP(k, e.target.value); applyTheme(); persist(); render(true); });
  function applyTheme() { const t = S().set.theme; if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); A.drawPlan(); }

  /* ===== sample project ===== */
  function sample() {
    const p = A.blank('ตัวอย่าง: อาคารสำนักงาน 2 ชั้น'); let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5;
    const T = { CP1: { E: 1000, N: 1000, Z: 12.35 }, T1: { E: 1152.418, N: 1012.736 }, T2: { E: 1218.905, N: 1121.287 }, T3: { E: 1104.276, N: 1203.551 }, T4: { E: 986.134, N: 1118.902 } };
    const CP2 = { E: 1003.5, N: 1310.2, Z: 13.02 };
    const nm = ['CP1', 'T1', 'T2', 'T3', 'T4'], n = nm.length; const noiseA = [2.5, -3.1, 1.8, 3.6, -1.2], noiseD = [0.004, -0.003, 0.005, -0.002, 0.003];
    const ang = (at, b, f) => SV.norm360(SV.az(at, f) - SV.az(at, b));
    p.pts.push({ n: 'CP1', E: '1000.000', N: '1000.000', Z: '12.350', c: 'CP' }, { n: 'CP2', E: '1003.500', N: '1310.200', Z: '13.020', c: 'CP' }, { n: 'BM2', E: '1230.400', N: '985.600', Z: '11.020', c: 'BM' });
    p.trav.rows = nm.map((k, i) => ({ name: k, angle: SV.fmtDMS(ang(T[k], T[nm[(i - 1 + n) % n]], T[nm[(i + 1) % n]]) + noiseA[i] / 3600, 1).replace(/[°'"]/g, ' ').trim(), dist: (SV.dist(T[k], T[nm[(i + 1) % n]]) + noiseD[i]).toFixed(3) }));
    p.trav.orient = { mode: 'bs', bs: 'CP2', ang: SV.fmtDMS(ang(T.CP1, CP2, T.T1), 1).replace(/[°'"]/g, ' ').trim(), az: '' };
    // topo points
    let k = 1; for (let i = 0; i < 17; i++) for (let j = 0; j < 14; j++) { const E = 1035 + i * 9 + rnd() * 5, No = 1035 + j * 9 + rnd() * 5; const Z = 10.6 + 0.011 * (E - 1000) + 0.004 * (No - 1000) + 2.1 * Math.exp(-((E - 1120) ** 2 + (No - 1095) ** 2) / 1600) - 0.9 * Math.exp(-((E - 1065) ** 2 + (No - 1140) ** 2) / 700) + rnd() * 0.06; p.pts.push({ n: 'TP' + k++, E: E.toFixed(3), N: No.toFixed(3), Z: Z.toFixed(3), c: 'TP' }); }
    p.tin = Object.assign(p.tin, { code: 'TP', maxEdge: '20', ci: '0.25', major: '4' });
    p.vol = Object.assign(p.vol, { exist: 'TP', level: '12.000', boundary: '', cell: '1' });
    p.grid = Object.assign(p.grid, { origin: '', E: '1085.000', N: '1060.000', az: '75 00 00', xs: '6, 6, 6, 6', ys: '5, 5', Z: '12.450', code: 'GRID' });
    p.stake = Object.assign(p.stake, { stn: 'T1', bsMode: 'point', bs: 'CP1', hi: '1.520', ht: '1.500', code: 'GRID', sort: true });
    p.lev.book = { start: 'CP1', startRL: '12.350', closeRL: '12.350', k: '12', km: '0.42', rows: [{ pt: 'CP1', bs: '1.432', is: '', fs: '' }, { pt: 'A1', bs: '', is: '1.528', fs: '' }, { pt: 'TP-1', bs: '1.215', is: '', fs: '1.985' }, { pt: 'T1', bs: '1.604', is: '', fs: '1.322' }, { pt: 'TP-2', bs: '1.402', is: '', fs: '0.968' }, { pt: 'CP1', bs: '', is: '', fs: '1.374' }] };
    p.lev.net = { k: '12', bms: [{ name: 'CP1', H: '12.350' }, { name: 'BM2', H: '11.020' }], obs: [{ from: 'CP1', to: 'T1', dh: '-0.660', dist: '0.16' }, { from: 'T1', to: 'BM2', dh: '-0.673', dist: '0.09' }, { from: 'T1', to: 'T2', dh: '0.912', dist: '0.13' }, { from: 'T2', to: 'BM2', dh: '-1.581', dist: '0.14' }, { from: 'CP1', to: 'T4', dh: '0.418', dist: '0.12' }, { from: 'T4', to: 'T2', dh: '-0.170', dist: '0.24' }] };
    const g = SV.gridPoints({ E: 1085, N: 1060, az: 75, xs: [6, 6, 6, 6], ys: [5, 5], xLabels: ['1', '2', '3', '4', '5'], yLabels: ['A', 'B', 'C'], side: 'left' });
    g.forEach(q => p.pts.push({ n: q.name, E: q.E.toFixed(3), N: q.N.toFixed(3), Z: '12.450', c: 'GRID' }));
    { const gg = p.lev.grid; Object.assign(gg, { bm: 'CP1', bmRL: '12.350', closeFS: '', k: '12', km: '0.2', nx: '6', ny: '5', dx: '10', dy: '10', design: '11.500', slopeX: '0', slopeY: '0', truck: '6', E: '1040', N: '1150', az: '90' }); gg.setups = [{ bs: '1.385', tpFS: '' }]; const HI = 13.735; gg.cells = {};
      for (let j = 0; j < 5; j++) for (let i = 0; i < 6; i++) { const E = 1040 + i * 10, No = 1150 - j * 10; const Z = 10.6 + 0.011 * (E - 1000) + 0.004 * (No - 1000) + 2.1 * Math.exp(-((E - 1120) ** 2 + (No - 1095) ** 2) / 1600) - 0.9 * Math.exp(-((E - 1065) ** 2 + (No - 1140) ** 2) / 700) + rnd() * 0.04; gg.cells[j + '_' + i] = (HI - Z).toFixed(3); }
      gg.closeFS = '1.388'; }
    p.cogo.inv = { a: 'CP1', b: 'CP2' }; p.cogo.area.list = 'A1, A5, C5, C1';
    return p;
  }

  /* ===== init ===== */
  (function init() {
    const ix = A.index(); let loaded = false;
    if (ix.cur && A.loadProj(ix.cur)) loaded = true; else if (ix.list.length && A.loadProj(ix.list[0].id)) loaded = true;
    if (!loaded) { A.setS(A.blank()); }
    A.ptsDirty(); A.refreshDatalist(); window.projSelect(); applyTheme(); nav(); render();
    setTimeout(() => A.getDL(), 300);
    if (!S().pts.length) toast('เริ่มจากนำเข้าจุด หรือกด “ตัวอย่าง” ด้านบนเพื่อลองใช้งาน', 5000);
  })();
})();
